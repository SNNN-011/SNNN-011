name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["main"] }
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { ref: output }
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: SNNN-011
          base: header, activity, community, repositories, metadata
          config_output: svg
          filename: metrics.svg
          output: ${{ github.workspace }}/metrics.svg
          template: classic
          plugins: languages, followup, people, traffic, projects, isocalendar
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_people: yes
          plugin_people_limit: 24
          plugin_people_size: 28
          plugin_followup: yes
          plugin_traffic: yes
          plugin_projects: yes
          plugin_isocalendar: yes
      - name: Commit metrics to output branch
        run: |
          git config user.name "Yasin"
          git config user.email "yasinhacker135@gmail.com"
          git add metrics.svg
          git commit -m "chore: update metrics" || echo "no change"
          git push
