name: Metrics
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
  push: { branches: ["main"] }
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          user: SNNN-011
          base: header, activity, community, repositories, metadata
          config_output: svg
          output_action: gist
          config_output: svg
          filename: metrics.svg
          config_presets: metrics.plugin.isocalendar
          template: classic
          plugins: languages, followup, people, traffic, projects, stellar
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_people: yes
          plugin_people_limit: 24
          plugin_people_size: 28
          plugin_followup: yes
          plugin_traffic: yes
          plugin_projects: yes
          plugin_stellar: yes
      - name: Upload metrics to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
